<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com https://telegram.org; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://unpkg.com https://tile.openstreetmap.org https://api.tomtom.com; connect-src https://photon.komoot.io https://router.project-osrm.org https://routing.openstreetmap.de; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="origin">
  <title>Mahmud · Карта</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div id="map" aria-label="Карта"></div>

  <form id="search" autocomplete="off">
    <input id="query" type="search" placeholder="Куда едем? Адрес или место" maxlength="200" enterkeyhint="search">
    <button type="submit">Найти</button>
    <ul id="results" hidden></ul>
  </form>

  <button id="locate" type="button" title="Моё место">📍</button>

  <section id="panel">
    <button id="grip" type="button" aria-label="Свернуть или развернуть панель"></button>
    <div class="modes">
      <button type="button" data-mode="car" class="on">🚗 Авто</button>
      <button type="button" data-mode="foot">🚶 Пешком</button>
      <button type="button" id="traffic">🚦 Пробки</button>
    </div>
    <p id="status" role="status">Найдите место или нажмите на карту, чтобы добавить точку.</p>
    <div id="routes"></div>
    <ol id="points"></ol>
    <div class="actions">
      <button type="button" id="optimize" hidden>⚡ Лучший порядок</button>
      <button type="button" id="save-route" hidden>💾 Сохранить маршрут</button>
      <button type="button" id="clear" hidden>🧹 Очистить</button>
    </div>
    <div class="actions" id="open-in" hidden>
      <a id="go-2gis" target="_blank" rel="noopener noreferrer">2GIS</a>
      <a id="go-yandex" target="_blank" rel="noopener noreferrer">Яндекс (пробки)</a>
      <a id="go-google" target="_blank" rel="noopener noreferrer">Google</a>
    </div>
    <details id="saved">
      <summary>⭐ Сохранённые места и маршруты</summary>
      <ul id="saved-list"></ul>
    </details>
  </section>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=6"></script>
</body>
</html>
